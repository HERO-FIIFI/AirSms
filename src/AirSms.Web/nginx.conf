server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health/live {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /health/ready {
        return 200 "ready\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
